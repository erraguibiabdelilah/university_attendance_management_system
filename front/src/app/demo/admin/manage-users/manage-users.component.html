<div class="row">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header"><h5>Create User</h5></div>
      <div class="card-body">
        <form [formGroup]="userForm" (ngSubmit)="createUser()">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input class="form-control" formControlName="fullName" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" formControlName="email" />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password" />
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" formControlName="role">
              <option value="STUDENT">STUDENT</option>
              <option value="TEACHER">TEACHER</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Create User</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-7">
    <div class="card">
      <div class="card-header"><h5>All Users</h5></div>
      <div class="card-body">
        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div *ngIf="loading">Loading...</div>
        <div class="table-responsive" *ngIf="!loading">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of users">
                <td>{{ user.id }}</td>
                <td>{{ user.firstName }} {{ user.lastName }}</td>
                <td>{{ user.username }}</td>
                <td>{{ getPrimaryAuthority(user) }}</td>
                <td><button class="btn btn-danger btn-sm" (click)="deleteUser(user.id)">Delete</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
