<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Face Scan Test</title>

    <style>

        body{
            font-family: Arial;
            text-align:center;
            background:#f5f5f5;
        }

        video{
            width:400px;
            border-radius:10px;
            border:3px solid #333;
        }

        button{
            margin-top:20px;
            padding:12px 20px;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            color:green;
        }

    </style>

</head>
<body>

<h1>Face Recognition Test</h1>

<video id="video" autoplay></video>

<br>

<button onclick="captureFace()">
    Scanner Visage
</button>

<p id="result"></p>

<script>

    const video = document.getElementById("video");

    const USER_ID = 1;

    let currentPhoto = 1;

    const encodings = [];

    // =====================================
    // START CAMERA
    // =====================================

    async function startCamera(){

        const stream = await navigator.mediaDevices.getUserMedia({
            video:true
        });

        video.srcObject = stream;
    }

    startCamera();

    // =====================================
    // CAPTURE FACE
    // =====================================

    async function captureFace(){

        try{

            if(currentPhoto > 3){
                throw new Error("Les 3 photos sont déjà capturées");
            }

            if(!video.videoWidth || !video.videoHeight){
                throw new Error("Camera non prête");
            }

            const canvas = document.createElement("canvas");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(video,0,0);

            const base64 = canvas.toDataURL("image/jpeg");

            // =====================================
            // 1. SEND TO PYTHON
            // =====================================

            const pyResponse = await fetch(
                "http://127.0.0.1:8000/extract-encoding",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        frame:base64,
                        photoIndex:currentPhoto,
                        userId:USER_ID
                    })
                }
            );

            if(!pyResponse.ok){

                const err = await pyResponse.json();

                throw new Error(err.detail);
            }

            const pyData = await pyResponse.json();

            console.log("PYTHON RESPONSE",pyData);

            // =====================================
            // SAVE ENCODING LOCAL
            // =====================================

            encodings.push(pyData.encoding);

            // =====================================
            // 2. SAVE TO SPRING BOOT
            // =====================================

            const javaResponse = await fetch(
                "http://localhost:8080/api/face/save-encoding",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        userId:USER_ID,
                        encoding:pyData.encoding,
                        photoIndex:currentPhoto
                    })
                }
            );

            if(!javaResponse.ok){

                const err = await javaResponse.json().catch(() => ({}));

                throw new Error(err.detail || err.message || "Erreur Spring Boot");
            }

            const javaData = await javaResponse.json();

            console.log("JAVA RESPONSE",javaData);

            document.getElementById("result").innerHTML =
                "Encoding " + currentPhoto + "/3 sauvegardé";

            currentPhoto++;

            // =====================================
            // VERIFY LIVENESS
            // =====================================

            if(currentPhoto > 3){

                verifyLiveness();
            }

        }catch(e){

            console.error(e);

            document.getElementById("result").innerHTML =
                e.message;
        }
    }

    // =====================================
    // VERIFY LIVENESS
    // =====================================

    async function verifyLiveness(){

        try{

            const response = await fetch(
                "http://127.0.0.1:8000/verify-liveness",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        encodings:encodings
                    })
                }
            );

            if(!response.ok){

                const err = await response.json();

                throw new Error(err.detail);
            }

            const data = await response.json();

            document.getElementById("result").innerHTML =
                "✅ Liveness Validé";

            console.log(data);

        }catch(e){

            document.getElementById("result").innerHTML =
                e.message;
        }
    }

</script>

</body>
</html>
