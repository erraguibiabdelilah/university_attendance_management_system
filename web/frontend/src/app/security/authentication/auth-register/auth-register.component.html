<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a href="javascript:"><img src="../../../../assets/images/logo-dark.svg" alt="logo img" /></a>
      </div>
      <div class="card my-5">

        <form [formGroup]="registerForm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Sign up</b></h3>
            <a [routerLink]="['/login']" class="link-primary">Already have an account?</a>
          </div>


          <div class="form-group mb-3">
            <label class="form-label" for="emailAddress">Email Address*</label>
            <input type="email" formControlName="username" class="form-control" id="emailAddress" placeholder="Email Address" />
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" formControlName="password" class="form-control" id="password" placeholder="Password" />
          </div>
          <p class="mt-4 text-sm text-muted">
            By Signing up, you agree to our
            <a href="javascript:" class="text-primary">Terms of Service</a>
            and
            <a href="javascript:" class="text-primary">Privacy Policy</a>
          </p>
          <div class="d-grid mt-3">
            <button type="button" (click)="register()" class="btn btn-primary">Create Account</button>
          </div>


        </div>
        </form>
      </div>



    </div>
  </div>
</div>
